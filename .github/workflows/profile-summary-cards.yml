name: Profile summary cards

# Generates GitHub stats / language cards as SVGs committed into the repo. The profile
# README no longer shows them (the 700x200 card was unreadable in the mobile column and
# repeated GitHub's own contribution graph), so this runs only when triggered by hand.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          # Shown in full; the default "login (name)" title is clipped to 22 characters.
          # No THEME input: the action clears the output folder before each run.
          NAME: Shaan Satsangi
