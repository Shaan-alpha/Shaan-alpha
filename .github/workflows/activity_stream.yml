name: ⚡ Dynamic Daily Activity Stream

on:
  schedule:
    - cron: "0 0 * * *" # Every midnight UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Fetch Activity and Update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Quoted heredoc: the shell expands nothing inside the Python program.
          edit() {
          python - <<'PY'
          import datetime, html, json, os, re, sys, urllib.request

          HEADERS = {'User-Agent': 'Shaan-alpha-Activity-Stream', 'Authorization': f'Bearer {os.environ["GH_TOKEN"]}'}

          # Never listed: VouchRank is not featured (Shaan, 2026-10-31), and pushes to this
          # profile repo would only announce the README's own edits.
          SKIP = {'shaan-alpha/vouchrank', os.environ.get('GITHUB_REPOSITORY', '').lower()}

          def get(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read().decode())

          def title_html(text):
              # Escaped, so a title renders only as text. Backtick spans become <code>
              # elements, because Markdown never decodes entities inside a code span.
              return re.sub(r'`([^`]+)`', r'<code>\1</code>', html.escape(text))

          try:
              events = get('https://api.github.com/users/Shaan-alpha/events/public')
          except Exception as e:
              # Keep the last good list instead of replacing it with a placeholder.
              print(f'Error fetching events: {e}; README left unchanged')
              sys.exit(0)

          lines = []
          seen_repos = set()

          for event in events:
              if len(lines) >= 5: break
              repo_name = event['repo']['name']
              if repo_name.lower() in SKIP: continue
              event_type = event['type']
              payload = event.get('payload') or {}
              created_at = datetime.datetime.strptime(event['created_at'], '%Y-%m-%dT%H:%M:%SZ').strftime('%b %d, %Y')
              # His own repos go by their short name: the owner prefix is redundant on his
              # profile and made the bold link wrap at its hyphen in the phone column.
              label = repo_name.split('/', 1)[1] if repo_name.startswith('Shaan-alpha/') else repo_name
              repo_link = f'<b><a href="https://github.com/{repo_name}">{label}</a></b>'

              if event_type == 'PushEvent' and repo_name not in seen_repos:
                  # Push payloads no longer carry a commit count, so none is shown.
                  lines.append(f'- Pushed to {repo_link} ({created_at})')
                  seen_repos.add(repo_name)
              elif event_type == 'PullRequestEvent' and payload.get('action') == 'opened':
                  pr_num = payload.get('number', '')
                  try:
                      pr_data = get(payload['pull_request']['url'])
                  except Exception:
                      continue  # state unknown, so it cannot be labelled honestly
                  if pr_data.get('state') == 'closed' and not pr_data.get('merged_at'):
                      continue  # closed without merging: never shown
                  pr_title = pr_data.get('title') or f'Pull Request #{pr_num}'
                  if pr_title.lower().startswith('chore(deps'):
                      continue  # dependency bumps are not worth a line
                  state = 'merged' if pr_data.get('merged_at') else 'open'
                  pr_url = pr_data.get('html_url') or f'https://github.com/{repo_name}/pull/{pr_num}'
                  lines.append(f'- Opened PR <a href="{pr_url}">"{title_html(pr_title)}"</a> in {repo_link} ({state}, {created_at})')
              elif event_type == 'WatchEvent' and payload.get('action') == 'started' and not repo_name.startswith('Shaan-alpha/') and repo_name not in seen_repos:
                  lines.append(f'- Starred repository {repo_link} ({created_at})')
                  seen_repos.add(repo_name)
              elif event_type == 'IssuesEvent' and payload.get('action') == 'opened':
                  issue_data = payload.get('issue') or {}
                  issue_num = issue_data.get('number', '')
                  if 'title' not in issue_data and issue_data.get('url'):
                      try:
                          issue_data = get(issue_data['url'])
                      except Exception:
                          pass
                  issue_title = issue_data.get('title') or f'Issue #{issue_num}'
                  issue_url = issue_data.get('html_url') or f'https://github.com/{repo_name}/issues/{issue_num}'
                  lines.append(f'- Opened issue <a href="{issue_url}">"{title_html(issue_title)}"</a> in {repo_link} ({created_at})')

          if not lines:
              lines.append('- No recent public activity.')

          output_str = '\n'.join(lines) + '\n'

          with open('README.md', 'r', encoding='utf-8') as f:
              readme = f.read()

          start_marker = '<!-- ACTIVITY_STREAM_START -->'
          end_marker = '<!-- ACTIVITY_STREAM_END -->'

          if readme.count(start_marker) == 1 and readme.count(end_marker) == 1:
              start_idx = readme.index(start_marker) + len(start_marker) + 1
              end_idx = readme.index(end_marker)
              new_readme = readme[:start_idx] + output_str + readme[end_idx:]
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(new_readme)
          else:
              sys.exit('ACTIVITY_STREAM markers must appear exactly once; README left unchanged')
          PY
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A push is rejected when main moved after this run checked it out (a guestbook or
          # AMA approval landing at the same time). Start again from the latest main and
          # re-apply the edit, so neither update is lost.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard FETCH_HEAD
            edit
            git add README.md
            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi
            git commit --quiet -m "docs(activity): automated daily activity stream update"
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected on attempt $attempt; retrying from the latest main."
            sleep $((attempt * 5))
          done
          echo "Could not push after 5 attempts; README left unchanged."
          exit 1
