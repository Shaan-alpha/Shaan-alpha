name: Sign my guestbook
description: Leave a note on my GitHub profile. I read every note before it goes up.
title: "[Guestbook]: "
labels: ["guestbook"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for stopping by. Once I have read your note I close this issue, and a GitHub Action adds your avatar and message under **Notes from visitors** on my profile.
  - type: input
    id: name
    attributes:
      label: Name / GitHub Handle
      description: How would you like to be identified?
      placeholder: e.g. @alex-dev or Alex
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: Role / Company / Location
      description: Where are you visiting from?
      placeholder: e.g. Backend engineer, Bengaluru
    validations:
      required: false
  - type: textarea
    id: message
    attributes:
      label: Your Message
      description: What brought you here, or which project caught your eye?
      placeholder: e.g. Ran Skill Issue on my own profile. Fair, if a little harsh.
    validations:
      required: true
