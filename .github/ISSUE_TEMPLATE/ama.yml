name: Ask me anything
description: Ask about my projects, how I build agents with guardrails, or starting out in AI engineering.
title: "[AMA]: "
labels: ["ama"]
assignees: ["Shaan-alpha"]
body:
  - type: markdown
    attributes:
      value: |
        Ask about Skill Issue, Atlas, Syntrueno or anything else on my profile: agents, retrieval, guardrails, or getting started. Once I have answered, I close the issue and the question and answer go up on my profile README.
  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know?
      placeholder: e.g. How does Skill Issue keep its score deterministic when a model writes the narrative?
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Background Context (Optional)
      description: Anything about your role or project that would help me answer?
      placeholder: e.g. Building my first RAG app with FastAPI.
    validations:
      required: false
