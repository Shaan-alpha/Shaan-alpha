<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Shaan Satsangi, AI systems engineer in Jaipur, India. The pattern behind his agent work: input goes to a model, its output passes guards and, where a mistake would be expensive, a human approval, then it ships.">
